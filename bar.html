<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16110d">
  <meta name="robots" content="noindex, nofollow">
  <title>Bar</title>
  <link rel="icon" href="images/cocktail-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bar.css">
</head>
<body>
  <header class="top">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="pl">PL</button>
    </div>
    <h1 id="title">Bar</h1>
    <p id="subtitle" class="subtitle"></p>
    <div class="tools">
      <input id="search" type="search" autocomplete="off" enterkeyhint="search">
      <div class="servings" role="group" aria-labelledby="servings-label">
        <span id="servings-label"></span>
        <button type="button" id="less" aria-label="−">−</button>
        <output id="servings">1</output>
        <button type="button" id="more" aria-label="+">+</button>
      </div>
    </div>
    <p id="wake" class="wake" hidden></p>
    <p id="sync" class="sync" role="status" hidden></p>
  </header>

  <main id="recipes" class="recipes" aria-live="polite"></main>

  <details id="settings" class="settings">
    <summary id="settings-title"></summary>
    <p id="token-help"></p>
    <p><a id="token-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener"></a></p>
    <div class="token-row">
      <input id="token" type="password" autocomplete="off" spellcheck="false">
      <button type="button" id="token-save"></button>
      <button type="button" id="token-remove"></button>
    </div>
    <p id="token-status" class="muted"></p>
  </details>

  <script src="drinks.js"></script>
  <script src="stock.js"></script>
  <script src="bar.js"></script>
</body>
</html>
