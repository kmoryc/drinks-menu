<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16110d">
  <meta name="robots" content="noindex, nofollow">
  <title>Bar</title>
  <link rel="icon" href="images/cocktail-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bar.css">
</head>
<body>
  <header class="top">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="pl">PL</button>
    </div>
    <h1 id="title">Bar</h1>
    <p id="subtitle" class="subtitle"></p>
    <div class="tools">
      <input id="search" type="search" autocomplete="off" enterkeyhint="search">
      <div class="servings" role="group" aria-labelledby="servings-label">
        <span id="servings-label"></span>
        <button type="button" id="less" aria-label="−">−</button>
        <output id="servings">1</output>
        <button type="button" id="more" aria-label="+">+</button>
      </div>
    </div>
    <p id="wake" class="wake" hidden></p>
  </header>

  <main id="recipes" class="recipes" aria-live="polite"></main>

  <script src="drinks.js"></script>
  <script src="bar.js"></script>
</body>
</html>
