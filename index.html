<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16110d">
  <title>Karol's Bar</title>
  <link rel="icon" href="images/cocktail-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="pl">PL</button>
    </div>
    <h1 id="title">Karol's Bar</h1>
    <p id="subtitle" class="subtitle"></p>
    <nav class="filters" role="tablist" aria-label="Category">
      <button type="button" data-filter="all"></button>
      <button type="button" data-filter="alcoholic"></button>
      <button type="button" data-filter="non-alcoholic"></button>
    </nav>
  </header>

  <main id="menu" class="menu" aria-live="polite"></main>

  <footer class="foot" id="footer"></footer>

  <script src="drinks.js"></script>
  <script src="stock.js"></script>
  <script src="app.js"></script>
</body>
</html>
